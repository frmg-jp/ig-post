# =====================================================================
# FREMING CURATED — 全設定
# コード変更なしで調整できる値はすべてここに集約する。
# APIキー等の秘匿値は .env（config.yaml には書かない）。
# =====================================================================

app:
  timezone: Asia/Tokyo
  db_path: data/freming.db
  log_dir: logs
  log_level: INFO

# ---------------------------------------------------------------------
# アクセスポリシー
#   ここの値は「守るための下限」であり、緩める方向の変更は想定しない。
#   ログイン・CAPTCHA回避・レート制限回避は一切実装しない。
# ---------------------------------------------------------------------
http:
  user_agent: "FremingCuratedBot/0.1 (+https://freming.jp/bot; contact@freming.jp)"
  request_interval_sec: 3.0        # 同一ドメインへの最低リクエスト間隔
  max_concurrency_per_domain: 1    # 同一ドメインへの並列アクセス禁止
  max_concurrency_global: 4
  timeout_sec: 30
  max_retries: 3
  backoff_factor: 2.0
  respect_robots_txt: true         # 監査のため明示。false は想定しない

collect:
  lookback_days: 30
  max_items_per_source_per_run: 30

# ---------------------------------------------------------------------
# 経路B: 編集ソース（品質の目利き。公式RSSフィードを優先）
#   feeds が空のソースは実フィードURLを確認してから enabled: true にする。
#   実装順に従い、まず dezeen のみ有効。
# ---------------------------------------------------------------------
editorial_sources:
  # --- 販売専門（掲載＝売出中。probe-feed で実測して採用） ---
  - key: wowhaus
    name: "WowHaus"
    rank: A
    enabled: true
    assume_for_sale: true
    feeds:
      - "https://www.wowhaus.co.uk/feed/"
  - key: circa_old_houses
    name: "CIRCA Old Houses"
    rank: B
    # 2026-08-01 の probe-feed --details で判明: このフィードは物件を配信して
    # いない。12件の内訳はエージェント紹介ページ11件とコラム1件で、物件ページは
    # 0件だった。URLも全て直下（/ann-gluck など）で、パスでの絞り込みもできない。
    #
    # assume_for_sale: true のままだとエージェント紹介ページを全て「売出中の
    # 物件」として取り込むため、両方を false にして停止する。
    # CIRCA の物件を扱うなら、物件専用のフィードを探すか手動投入で対応する:
    #   python -m freming.cli discover-feed https://circaoldhouses.com/
    enabled: false
    assume_for_sale: false
    # robots.txt が Crawl-delay: 60 を指定しているため、再開する場合も
    # 記事ページは取得しない（1件あたり60秒待つことになる）。
    fetch_article_pages: false
    feeds:
      - "https://circaoldhouses.com/feed/"
  - key: modernlivingla
    name: "Modern Living LA"
    rank: B
    enabled: true
    # 2026-08-01 の probe-feed: 9件 / 本文中央値1555字 / 候補2件。
    # 重点エリア（LA）で唯一、実際に候補が出たフィード。
    # 販売専門メディアの可能性が高いが未確認のため assume_for_sale は付けない。
    # 記事に市況コラムが混ざっていた場合、全件が候補になってしまうため。
    feeds:
      - "https://modernlivingla.com/feed/"
  - key: sixsqft
    name: "6sqft"
    rank: B
    enabled: true
    # 2026-08-01 の probe-feed: 10件 / 本文中央値4491字 / 候補2件。
    # NY・Brooklyn の売出物件を継続的に扱う。重点エリア追加後に見つけた
    # 中で最も歩留まりが良い。
    feeds:
      - "https://www.6sqft.com/feed/"

  # --- 編集メディア（販売記事は時々。ここが FREMING の独自性） ---
  - key: dezeen
    name: "Dezeen"
    rank: S
    enabled: true
    feeds:
      - "https://www.dezeen.com/feed/"          # 全カテゴリ（本文 中央値4408字）
  - key: dwell
    name: "Dwell"
    rank: S
    enabled: false
    feeds: []
  - key: designboom
    name: "designboom"
    rank: S
    enabled: true
    feeds:
      - "https://www.designboom.com/architecture/feed/"   # 本文 中央値5088字
  - key: wallpaper
    name: "Wallpaper*"
    rank: S
    enabled: true
    # フィードURLは discover-feed で判明（/architecture/feed という推測は外れ）。
    # 2026-08-01: 50件 / 本文中央値4606字 / 候補0件。dezeen と同じく販売記事は
    # 時々しか無いが、本文が厚いので出たときに拾える。
    feeds:
      - "https://www.wallpaper.com/feeds.xml"
  - key: archdaily
    name: "ArchDaily"
    rank: A
    enabled: false
    feeds: []
  - key: arch_record
    name: "Architectural Record"
    rank: A
    enabled: false
    feeds: []
  - key: domus
    name: "Domus"
    rank: A
    enabled: false
    feeds: []
  - key: ad
    name: "Architectural Digest"
    rank: B
    enabled: false
    feeds: []
  - key: iconic_houses
    name: "Iconic Houses"
    rank: B
    enabled: false
    feeds: []

# ---------------------------------------------------------------------
# 経路A: 販売ソース
#   mode: crawl        … robots.txt を確認したうえで自動収集
#   mode: manual_only  … 自動クロールを一切行わず、管理画面のURL投入のみ
# ---------------------------------------------------------------------
listing_sources:
  - key: sothebys
    name: "Sotheby's International Realty"
    rank: A
    mode: crawl
    enabled: false          # robots.txt 確認後に有効化
    base_url: "https://www.sothebysrealty.com"
  - key: christies
    name: "Christie's International Real Estate"
    rank: A
    mode: crawl
    enabled: false
    base_url: "https://www.christiesrealestate.com"
  - key: architecture_for_sale
    name: "Architecture For Sale"
    rank: A
    mode: crawl
    enabled: false
    base_url: "https://architectureforsale.com"
  - key: zillow
    name: "Zillow"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.zillow.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"
  - key: redfin
    name: "Redfin"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.redfin.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"
  - key: compass
    name: "Compass"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.compass.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"

# ---------------------------------------------------------------------
# 販売シグナル検出（経路Bの核心）
#   スコア合計が min_signal_score 以上のものだけを候補化する。
# ---------------------------------------------------------------------
for_sale_signals:
  keyword_score: 1
  # 仲介サイトへのリンクは「売出中」の裏付けとして弱い。2点にしていたところ、
  # CIRCA のエージェント紹介ページ（本人の Compass のプロフィールへリンク）が
  # それだけで候補化された（2026-08-01）。1点に下げ、リンク単独では
  # min_signal_score に届かないようにしている。
  listing_link_score: 1
  price_score: 1
  min_signal_score: 2
  # 価格は「販売キーワードの近くにあるもの」だけを加点対象にする。
  # これがないと、建設費や事業費（例: €240 million の競技場）を売出価格として
  # 誤検出する。0 にすると文中のあらゆる金額を拾う（非推奨）。
  price_requires_keyword_within: 200
  keywords:
    - "for sale"
    - "on the market"
    - "listed for"
    - "asking price"
    - "now available"
    - "price upon request"
    - "currently listed"
    - "販売中"
    - "売出中"
  price_patterns:
    - '[$€£]\s?\d[\d,.]*\s?(million|M|k)?\b'
    - '\d[\d,.]*\s?(万円|億円)'
  listing_domains:
    - sothebysrealty.com
    - christiesrealestate.com
    - architectureforsale.com
    - zillow.com
    - redfin.com
    - compass.com
    - idealista.com
    - idealista.pt
    - rightmove.co.uk

# ---------------------------------------------------------------------
# 重点エリア / 優先ジャンル
# ---------------------------------------------------------------------
# 承認実績（docs/approval-criteria.md）に Chicago / Brooklyn が含まれていたため、
# 両都市を重点エリアに追加。district は承認実例のあった地区を明記している。
focus_areas:
  - { country: "United States", city: "Los Angeles" }
  - { country: "United States", city: "San Francisco", districts: ["South Beach", "SOMA"] }
  - { country: "United States", city: "Portland", districts: ["Pearl District"] }
  - { country: "United States", city: "Seattle", districts: ["Pioneer Square"] }
  - { country: "United States", city: "Chicago", districts: ["West Loop", "Wicker Park", "Logan Square"] }
  - { country: "United States", city: "New York", districts: ["DUMBO", "Brooklyn", "Williamsburg", "Tribeca"] }
  - { country: "Portugal" }
  - { country: "Spain" }
  - { country: "Taiwan" }

# ---------------------------------------------------------------------
# 連載企画のラベル
#   どの企画に載せるかは編集判断であり、記事本文から機械的には決まらない。
#   スコアリングでは判定せず、審査UIで人が付ける。
#   key はDBに保存される値なので変更しない。label は表示名なので変更可。
# ---------------------------------------------------------------------
series:
  - { key: freming_pick,          label: "FREMING Pick" }
  - { key: hidden_gem,            label: "Hidden Gem" }
  - { key: penthouse_of_the_week, label: "Penthouse of the Week" }
  - { key: adaptive_reuse,        label: "Adaptive Reuse" }
  - { key: warehouse_loft,        label: "Warehouse Loft" }
  - { key: architects_house,      label: "Architect's House" }

# 承認済み8物件の分析（docs/approval-criteria.md）に基づくキーワード。
# 「前歴が目に見える形で残っている」ことが最も強い共通項だったため、
# ゴーストサイン・用途固有の部材・露出構造を示す語を厚くしている。
genres:
  priority: [adaptive_reuse, loft, architect, hidden_gem, penthouse]
  keywords:
    adaptive_reuse:
      ["conversion", "converted", "adaptive reuse", "former factory", "former school",
       "firehouse", "fire station", "warehouse conversion", "church conversion",
       "former warehouse", "clock tower", "ghost sign", "originally built as",
       "once a", "repurposed", "power station", "grain silo", "schoolhouse"]
    loft:
      ["loft", "warehouse", "industrial space", "open plan", "live/work",
       "exposed brick", "timber truss", "heavy timber", "cast iron column",
       "tin ceiling", "pressed metal ceiling", "freight elevator"]
    penthouse: ["penthouse", "rooftop residence", "top floor"]
    architect:
      ["designed by", "architect's own", "landmark home", "modernist",
       "midcentury", "mid-century", "case study house", "spanish colonial",
       "craftsman", "usonian", "post and beam", "butterfly roof"]
    hidden_gem: ["rarely seen", "little-known", "hidden", "off market", "never listed"]

# ---------------------------------------------------------------------
# スコアリング（Claude API）
# ---------------------------------------------------------------------
scoring:
  model: "claude-sonnet-5"     # 上位に切替可: claude-opus-5
  # max_tokens は thinking と本文の合計に効く上限。claude-sonnet-5 は
  # thinking パラメータを省略すると adaptive thinking が既定で動くため、
  # 判定結果のJSON自体は小さくても上限に届きうる。2000 では打ち切られる
  # 可能性があるので余裕を持たせている（打ち切られた場合は
  # ScoringError で理由が出る）。
  max_tokens: 8000
  effort: medium               # low | medium | high | xhigh | max
  summary_max_chars: 80
  score_scale: 100             # 0-100
  weights:                     # 合計 1.0
    story: 0.25                       # 用途転換・歴史・建築家の物語
    source_rank: 0.15                 # S > A > B
    editorial_for_sale_bonus: 0.20    # 編集ソース掲載 かつ 販売中 = Hidden Gem
    genre_match: 0.15
    area_match: 0.20                  # 重点エリアを優先（2026-08-01 に 0.10 から引き上げ）
    price: 0.05                       # 二の次。高額を優遇しない
  source_rank_score:
    S: 1.0
    A: 0.7
    B: 0.4
  # スコアリングのプロンプトに含める承認済みの実例（docs/approval-criteria.md）。
  # 「なぜ承認されたか」を few-shot としてLLMに示し、判断基準を揃える。
  approved_examples:
    - "1868年の倉庫 Oriental Warehouse（SF South Beach）。壁面のゴーストサインとアーチ、木トラスが住居に残る"
    - "電気設備会社 EOFF Electric Company の社屋（Portland Pearl District）。壁面広告がそのまま残る"
    - "消防署のコンバージョン（Chicago）。赤いアーチ型の消防車扉が現役のまま玄関、ブリキ型押し天井"
    - "Eagle Warehouse の時計塔（Brooklyn DUMBO）。巨大な時計文字盤がそのまま窓になっている"
    - "花崗岩の山塊の直下に建つ砂漠のモダニズム住宅（東シエラ）。立地そのものが主題"
    - "板張り天井と石積み暖炉のミッドセンチュリー住宅（LA丘陵）。時代の家具ごと残る"
    - "素焼き瓦と白漆喰のスパニッシュコロニアル（LA）。庭と建物が一体"
    - "深い軒と木の重なりを持つ和／クラフツマン住宅（LA近郊）。庭に鉄の産業遺物"
  # 上の実例から抽出した、判断の軸（プロンプトに明示する）
  approval_notes:
    - "最重要は『前歴が目に見える形で残っている』こと。単に用途転換されただけでは足りず、転換前の正体が写真から読み取れること（ゴーストサイン、用途固有の部材、露出構造）"
    - "時代・様式が特定できること。様式不明の現代建売・新築マンションは対象外"
    - "一点物であること。同一仕様が複数存在する物件は対象外"
    - "立地が物語の一部になっていること"
    - "重点エリアは加点要素であり足切り条件ではない。物語性が十分に強ければエリア外でも承認しうる（Chicago / Brooklyn は承認実績を受けて重点エリアに追加した経緯がある）"
  thresholds:
    min_to_persist: 30         # これ未満は保存はするが一覧デフォルト非表示
    highlight_above: 80
  feedback:
    recent_reasons_in_prompt: 30   # 直近N件の非承認理由をプロンプトに含める
    tagging_batch_size: 10         # N件溜まるごとに reason_tag を付与
    rule_candidate_min_hits: 3     # 同一タグがN回でルール候補として提示
    # 非承認理由の分類先。表記のゆれを吸収して集計できるようにするための
    # 固定語彙。どれにも当てはまらない理由は other に寄せ、頻出するようなら
    # ここに新しいタグを足す。
    tags:
      - no_visible_provenance   # 前歴の痕跡が残っていない
      - style_unclear           # 様式・築年が特定できない
      - not_one_of_a_kind       # 一点物ではない（分譲・同一仕様）
      - not_for_sale            # 売出中ではない
      - image_quality           # 画像が足りない / 品質が低い
      - duplicate               # 既出・類似を納品済み
      - area_mismatch           # エリアが合わない
      - other

# ---------------------------------------------------------------------
# 審査UI
# ---------------------------------------------------------------------
review_ui:
  host: "127.0.0.1"
  port: 8000
  page_size: 50
  default_filter: pending
  thumbnail_max_px: 480

# ---------------------------------------------------------------------
# 画像取得・加工
# ---------------------------------------------------------------------
images:
  max_per_property: 10
  min_short_edge_px: 800           # ロゴ・アイコン混入対策
  allowed_content_types: ["image/jpeg", "image/png", "image/webp"]
  work_dir: "data/images"

process:
  output_size: [1080, 1080]
  jpeg_quality: 90
  pad_when_aspect_over: 2.0        # 縦横比2.0超はクロップせず余白パディング
  pad_color: "#FFFFFF"
  resample: lanczos

# ---------------------------------------------------------------------
# Drive納品
#   parent_folder_id: 納品先の親フォルダ
#   shared_drive_id : 共有ドライブ配下ならそのドライブID（マイドライブなら null）
#     ※ サービスアカウントは「マイドライブ」に保存容量を持たないため、
#       共有ドライブを強く推奨。詳細は scripts/check_drive.py の診断を参照。
# ---------------------------------------------------------------------
drive:
  enabled: true
  # 認証方式:
  #   oauth           … OAuthクライアント（デスクトップアプリ）で人のアカウントとして認証。
  #                     組織ポリシーでサービスアカウント鍵を作れない場合はこれ。
  #   service_account … サービスアカウントのJSON鍵（credentials_path）
  #   adc             … gcloud のログイン / Workload Identity 連携 / 権限借用
  auth_mode: oauth
  oauth_client_secret_path: "credentials/oauth_client.json"
  oauth_token_path: "credentials/token.json"     # 初回認証後に自動生成される
  credentials_path: "credentials/service-account.json"   # auth_mode: service_account 用
  parent_folder_id: "1HrlJ9QFGlTEVl8M-HY8nxGTu3DvkCNV3"   # ig-post（共有ドライブ配下）
  shared_drive_id: "0AMkLSuinS6H_Uk9PVA"
  folder_prefix: "frmg_ig"
  sequence_digits: 3
  meta_filename: "meta.txt"
  verify_uploaded_size: true       # アップロード後 files.get でサイズ再取得し 0 バイトでないか確認
  preflight:
    enabled: true                  # 起動時に実際にテストファイルを作成→削除して権限検証
    test_filename: ".frmg_write_test"
  retry:
    max_attempts: 5
    backoff_factor: 2.0
