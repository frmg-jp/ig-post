# =====================================================================
# FREMING CURATED — 全設定
# コード変更なしで調整できる値はすべてここに集約する。
# APIキー等の秘匿値は .env（config.yaml には書かない）。
# =====================================================================

app:
  timezone: Asia/Tokyo
  db_path: data/freming.db
  log_dir: logs
  log_level: INFO

# ---------------------------------------------------------------------
# アクセスポリシー
#   ここの値は「守るための下限」であり、緩める方向の変更は想定しない。
#   ログイン・CAPTCHA回避・レート制限回避は一切実装しない。
# ---------------------------------------------------------------------
http:
  user_agent: "FremingCuratedBot/0.1 (+https://freming.jp/bot; contact@freming.jp)"
  request_interval_sec: 3.0        # 同一ドメインへの最低リクエスト間隔
  max_concurrency_per_domain: 1    # 同一ドメインへの並列アクセス禁止
  max_concurrency_global: 4
  timeout_sec: 30
  max_retries: 3
  backoff_factor: 2.0
  respect_robots_txt: true         # 監査のため明示。false は想定しない

collect:
  lookback_days: 30
  max_items_per_source_per_run: 30

# ---------------------------------------------------------------------
# 経路B: 編集ソース（品質の目利き。公式RSSフィードを優先）
#   feeds が空のソースは実フィードURLを確認してから enabled: true にする。
#   実装順に従い、まず dezeen のみ有効。
# ---------------------------------------------------------------------
editorial_sources:
  # --- 販売専門（掲載＝売出中。probe-feed で実測して採用） ---
  - key: wowhaus
    name: "WowHaus"
    rank: A
    enabled: true
    assume_for_sale: true
    feeds:
      - "https://www.wowhaus.co.uk/feed/"
  - key: circa_old_houses
    name: "CIRCA Old Houses"
    rank: B
    # 2026-08-01 の probe-feed --details で判明: このフィードは物件を配信して
    # いない。12件の内訳はエージェント紹介ページ11件とコラム1件で、物件ページは
    # 0件だった。URLも全て直下（/ann-gluck など）で、パスでの絞り込みもできない。
    #
    # assume_for_sale: true のままだとエージェント紹介ページを全て「売出中の
    # 物件」として取り込むため、両方を false にして停止する。
    # CIRCA の物件を扱うなら、物件専用のフィードを探すか手動投入で対応する:
    #   python -m freming.cli discover-feed https://circaoldhouses.com/
    enabled: false
    assume_for_sale: false
    # robots.txt が Crawl-delay: 60 を指定しているため、再開する場合も
    # 記事ページは取得しない（1件あたり60秒待つことになる）。
    fetch_article_pages: false
    feeds:
      - "https://circaoldhouses.com/feed/"
  - key: modernlivingla
    name: "Modern Living LA"
    rank: B
    enabled: true
    # 2026-08-01 の probe-feed: 9件 / 本文中央値1555字 / 候補2件。
    # 重点エリア（LA）で唯一、実際に候補が出たフィード。
    # 販売専門メディアの可能性が高いが未確認のため assume_for_sale は付けない。
    # 記事に市況コラムが混ざっていた場合、全件が候補になってしまうため。
    feeds:
      - "https://modernlivingla.com/feed/"
  - key: sixsqft
    name: "6sqft"
    rank: B
    enabled: true
    # 2026-08-01 の probe-feed: 10件 / 本文中央値4491字 / 候補2件。
    # NY・Brooklyn の売出物件を継続的に扱う。重点エリア追加後に見つけた
    # 中で最も歩留まりが良い。
    #
    # 2026-08-03: **フィードの窓が10件＝3.2日分しかない**（3.1本/日）。
    # 4件のソースの中で最も薄い。定期実行が3日止まると取りこぼす。
    # 物件は distinctive-homes カテゴリにまとまっている（一覧に179件）。
    feeds:
      - "https://www.6sqft.com/feed/"
    index_urls:
      - "https://www.6sqft.com/category/distinctive-homes/"
    # 記事は slug がドメイン直下。/category/... や /manhattan/... は
    # 2階層になるのでこの形に合わない。同じ形をした固定ページだけ除く。
    url_include:
      - "^https://www\\.6sqft\\.com/[a-z0-9-]+$"
    url_exclude:
      - "^https://www\\.6sqft\\.com/neighborhoods$"
      - "^https://www\\.6sqft\\.com/about$"
      - "^https://www\\.6sqft\\.com/contact$"
      - "^https://www\\.6sqft\\.com/advertise$"
      - "^https://www\\.6sqft\\.com/newsletter$"

  - key: thespaces
    name: "The Spaces"
    rank: B
    enabled: true
    # 2026-08-03 の collect --explain（記事ページ取得あり）:
    #   10件 / 1.1本/日（8日分）/ 候補6件 → 審査 週4.7件
    # 6件すべて2点、残り4件（音楽・美術・デザイン評論・家具）は0点。
    # 1点の中間が無く、判定が内容できれいに分離している。
    # 現時点で最も歩留まりが良く、配信も止まっていない唯一のソース。
    #
    # フィードは抜粋（240字）しか配信しないので、probe-feed では構造的に
    # 候補0件になる。判断は必ず collect --explain で行うこと。
    #
    # 2026-08-03 追記: サイト全体のフィードからカテゴリ専用フィードに変えた。
    # 全体フィードは10件で 7.2日分、うち4件が非物件（音楽・美術・家具）に
    # 食われて物件は6件だった。category/property/feed は10件全部が物件で
    # 12.2日分ある。同じ10件の枠を物件だけに使える。
    fetch_article_pages: true
    feeds:
      - "https://thespaces.com/category/property/feed/"
    # フィードは10件しか配信しない。一覧ページには20件並んでいて、
    # 11件目から下は一度もフィードに現れないまま落ちる。ここを拾う。
    index_urls:
      - "https://thespaces.com/category/property/"
    # 記事URLは slug がドメイン直下に来る。一覧ページにはナビゲーションや
    # カテゴリのリンクも入るので、この形のものだけ通す。
    url_include:
      - "^https://thespaces\\.com/[a-z0-9-]+$"
    url_exclude:
      - "/terms-of-service"
      - "/privacy-policy"
      - "/about"
      - "/contact"
      - "/newsletter"
  - key: themodernspaces
    name: "The Modern Spaces"
    rank: B
    # 2026-08-03: **フィードが止まっている（最新記事が110日前）。**
    # collect.lookback_days = 30 より古いので、回しても1件も入らない。
    #
    # 同日の probe では「10件 / 本文中央値5277字 / 候補0件」と出て、本文が
    # 厚いので dezeen と同じ「販売記事は時々」の扱いで有効化していた。
    # 停止判定を入れて測り直したところ止まっていたと分かり、無効化した。
    # 窓の長さ（本/日）だけでは、動いているかどうかは分からない。
    #
    # 再開したら戻す。リスボンの住宅を扱うので、ポルトガルの供給源としては
    # 価値がある。
    enabled: false
    fetch_article_pages: false
    feeds:
      - "https://themodernspaces.com/feed/"
  - key: portlandscondos
    name: "Portland's Condos"
    rank: B
    # 2026-08-03 の probe-feed: 10件 / 本文中央値2313字 / 6件が販売シグナル1点。
    # Portland（重点エリアで未充足）の売出物件を継続的に扱っており、
    # フィードの質としては採用圏内。
    #
    # ただし **有効化する前に画像の権利を確認すること**。これは仲介業者の
    # ブログで、掲載写真はMLS/ブローカー帰属の可能性が高い。docs/source-survey.md
    # で26サイトを×にしたのと同じ理由がここにも当てはまる。フィードが読めることと
    # 写真を再配布してよいことは別問題なので、確認できるまで false のままにする。
    enabled: false
    feeds:
      - "https://portlandscondos.com/feed/"
    # コメントフィードは /buildings/ の建物ページを指すので使わない。

  # --- 編集メディア（販売記事は時々。ここが FREMING の独自性） ---
  - key: dezeen
    name: "Dezeen"
    rank: S
    enabled: true
    feeds:
      - "https://www.dezeen.com/feed/"          # 全カテゴリ（本文 中央値4408字）
  - key: dwell
    name: "Dwell"
    rank: S
    enabled: true
    # 2026-08-03 の probe-feed: 30件 / 本文中央値2917字 / 1.2本/日 / 候補3件
    #   → 審査 週0.9件。全米を扱うソースとして現時点で唯一まともに動くもの。
    # 本文を丸ごと配信するので記事ページは取りに行かない。
    fetch_article_pages: false
    # 「Ask a Realtor」は住宅ローンや金利の相談コラムで、物件記事ではない。
    # 連載なので毎週出る。本文に「for sale」「asking price」が普通に入るため
    # 放っておくと定期的に誤検出する（実際 probe で2点が付いた）。
    url_exclude:
      - "/ask-a-realtor"
    feeds:
      - "https://www.dwell.com/@dwell/rss"
    # 2026-08-03: フィードは30件＝25日分あるので、日々の取りこぼしは無い。
    # 一覧ページを足すのは、パイプライン開始前に出た記事を拾うため。
    # real-estate セクションに /article/<slug> が40件並ぶ。
    #
    # 記事ページを取りに行かない設定（fetch_article_pages: false）だが、
    # 一覧ページ由来の記事にはフィード本文が無いので、そこだけは取得する。
    index_urls:
      - "https://www.dwell.com/real-estate"
    url_include:
      - "^https://www\\.dwell\\.com/article/[a-z0-9-]+$"
  - key: designboom
    name: "designboom"
    rank: S
    enabled: true
    feeds:
      - "https://www.designboom.com/architecture/feed/"   # 本文 中央値5088字
  - key: wallpaper
    name: "Wallpaper*"
    rank: S
    enabled: true
    # フィードURLは discover-feed で判明（/architecture/feed という推測は外れ）。
    # 2026-08-01: 50件 / 本文中央値4606字 / 候補0件。dezeen と同じく販売記事は
    # 時々しか無いが、本文が厚いので出たときに拾える。
    feeds:
      - "https://www.wallpaper.com/feeds.xml"
  - key: archdaily
    name: "ArchDaily"
    rank: A
    # 2026-08-03: フィードは読めた（24件 / 376字 / 9.4本/日）。ただし抜粋配信
    # なので probe では候補0件になる。本数が多く、記事ページを取ると1回の
    # 収集で30回のアクセスになるため、歩留まりを確かめてから有効化する:
    #   python -m freming.cli collect --source archdaily --dry-run --explain
    # なお /cl/feed（チリ版）は robots で Disallow。本体の /feed は許可。
    enabled: false
    fetch_article_pages: true
    feeds:
      - "https://www.archdaily.com/feed"
  - key: arch_record
    name: "Architectural Record"
    rank: A
    # 2026-08-03: フィードを宣言していない（discover-feed で0件）。
    # robots.txt は Crawl-delay: 10 秒。配信URLが見つかるまで保留。
    enabled: false
    feeds: []
  - key: domus
    name: "Domus"
    rank: A
    enabled: false
    feeds: []
  - key: ad
    name: "Architectural Digest"
    rank: B
    # 2026-08-03: フィードは読めた（30件 / 154字 / 5.2本/日）。抜粋配信なので
    # probe では候補0件。セレブの自宅・インテリア記事が中心で、承認基準
    # （前歴が残る一点物）との相性は未検証。確かめてから有効化する:
    #   python -m freming.cli collect --source ad --dry-run --explain
    enabled: false
    fetch_article_pages: true
    feeds:
      - "https://www.architecturaldigest.com/feed/rss"
  - key: iconic_houses
    name: "Iconic Houses"
    rank: B
    # 2026-08-03: フィードを宣言していない（discover-feed で0件）。
    enabled: false
    feeds: []
  - key: robbreport_shelter
    name: "Robb Report / Shelter"
    rank: B
    enabled: true
    # 2026-08-03 の collect --explain（記事ページ取得あり）:
    #   10件 / 2.8本/日（3.2日分）/ 候補6件 → 審査 週11.8件
    # 全米の高級不動産。本数・鮮度ともに現時点で最大の供給源。
    #
    # 候補6件のうち3件は /homes-for-sale/（Landis Gores のグラスハウス、
    # Edward Durell Stone の1950年代住宅、Cotswolds の納屋転用）で承認基準
    # との相性が良い。残り3件は /celebrity-homes/ でまちまち。
    # 承認率を見てから /homes-for-sale/ に絞るかを決める。
    #
    # 抜粋配信（198字）なので probe-feed では構造的に候補0件になる。
    # 判断は必ず collect --explain で行うこと。
    fetch_article_pages: true
    # 代表画像が「物件写真に人物の顔写真を丸く重ねた合成画像」になっている。
    # セレブ記事では毎回この形なので、先頭を飛ばして2枚目から使う。
    # 審査UIのサムネイルと納品の 01.jpg の両方に効く。
    skip_lead_image: true
    url_exclude:
      # 美術品オークションの記事。金額は出るが物件ではない。
      # 10件中2件がこのセクションだった（Monet、FBIの画廊捜索）。
      - "/art-collectibles/"
      # 「Tom Cruise の所有物件まとめ」のようなリスト記事。物件1件の
      # 記事ではないので、納品する素材にならない。
      - "/lists/"
    feeds:
      - "https://robbreport.com/shelter/feed/"
  - key: socketsite
    name: "SocketSite"
    rank: B
    # 2026-08-03: **フィードが止まっている。** 最新記事が 2024-07-15 で、
    # collect では 15件すべてが「期間外」になり1件も入らない。
    #
    # probe では「0.4本/日 / 候補1件」と健全に見えたが、これは2024年6〜7月の
    # 32日間から計算した値だった。窓の長さだけを見て採否を決めると、
    # 止まったフィードを採用してしまう。
    #
    # コメントフィード（/comments/feed）も使わない。probe では候補5件と
    # 出るが、中身は読者のコメント本文で、URLは過去記事を指している
    # （CIRCA のエージェント紹介ページと同じ形の罠）。
    enabled: false
    fetch_article_pages: true
    feeds:
      - "https://socketsite.com/feed"

# ---------------------------------------------------------------------
# 経路A: 販売ソース
#   mode: crawl        … robots.txt を確認したうえで自動収集
#   mode: manual_only  … 自動クロールを一切行わず、管理画面のURL投入のみ
# ---------------------------------------------------------------------
listing_sources:
  # 仲介ネットワークは掲載物件をMLSからIDXで受けており、IDX参加規約が
  # 再配布・スクレイピング・写真の再利用を禁じる。自社専任物件とIDX由来を
  # サイト上で機械的に分離できないため、robots.txt の内容によらず自動収集不可。
  # 調査の詳細は docs/source-survey.md（2026-08-03）。
  - key: sothebys
    name: "Sotheby's International Realty"
    rank: A
    mode: manual_only
    enabled: true
    base_url: "https://www.sothebysrealty.com"
    note: "IDX規約により自動収集不可。手動URL投入のみ"
  - key: christies
    name: "Christie's International Real Estate"
    rank: A
    mode: manual_only
    enabled: true
    base_url: "https://www.christiesrealestate.com"
    note: "IDX規約により自動収集不可。手動URL投入のみ"
  - key: architecture_for_sale
    name: "Architecture For Sale"
    rank: A
    mode: crawl
    enabled: false
    base_url: "https://architectureforsale.com"

  # ------------------------------------------------------------------
  # IDX由来を含む仲介サイト。2026-08-03、ユーザー判断により自動収集の
  # 対象にした。掲載物件にはMLSからIDXで供給された他社物件が含まれ、
  # 自社専任物件とサイト上で機械的に分離できない。写真の権利も掲載
  # ブローカー側にある。この点は承知のうえで取得している。
  #
  # 収集ポリシーのうち、robots.txt の尊重・3秒間隔・同一ドメインの
  # 直列化は従来どおり守る。bot検知を回避する実装は行わない。
  # 実測（2026-08-03、docs/idx-survey.md）で robots が許可し、かつ
  # サーバ側で描画していることを確認できた2件から始める。
  # ------------------------------------------------------------------
  - key: dreamtown
    name: "Dream Town Realty"
    rank: B
    mode: crawl
    enabled: true
    base_url: "https://www.dreamtown.com"
    note: "Chicago。sitemap.xml に物件ページが無く、一覧ページから拾う"
    crawl:
      index_urls:
        - "https://www.dreamtown.com/properties/coming-soon"
      detail_url_include:
        - "/properties/\\d+/"
      location_from: address
      max_details: 40
  - key: coldwellbanker
    name: "Coldwell Banker"
    rank: B
    mode: crawl
    enabled: true
    base_url: "https://www.coldwellbanker.com"
    note: "全米。当日追加分だけのsitemapがあるので差分収集の効率が良い"
    crawl:
      # 当日追加分。全物件のsitemapもあるが、毎日回す前提ならこちらで足りる。
      sitemap_urls:
        - "https://www.coldwellbanker.com/xml-sitemap/states/sitemapindex-listings-new-day.xml"
      # /tx/victoria/sunray-rd/lid-P008... のように 州/市/街路 が並ぶ。
      detail_url_include:
        - "\\.com/[a-z]{2}/[^/]+/[^/]+"
      max_details: 40
  # @properties は sitemap を resources.atproperties.com に置いているが、
  # そのサブドメインの robots.txt が 403 を返す。取得できない robots.txt は
  # 「許可されていない」と扱う（fail-closed）ので、収集できない。
  # 2026-08-03 に登録を試みて上記の理由で外した。再挑戦するなら、
  # www 側に置かれた sitemap を探すこと。
  - key: corcoranicon
    name: "Corcoran Icon Properties"
    rank: B
    mode: crawl
    enabled: true
    base_url: "https://corcoranicon.com"
    note: "San Francisco。Vanguard と同じ作りで、物件は5,528件"
    crawl:
      sitemap_urls:
        - "https://corcoranicon.com/sitemap.xml"
      sitemap_depth: 2
      detail_url_include:
        - "/properties/[^/]*-\\d{6,}$"
      max_details: 40
  - key: vanguard
    name: "Vanguard Properties"
    rank: B
    mode: crawl
    enabled: true
    base_url: "https://vanguardproperties.com"
    note: "San Francisco。物件sitemapが1万件超あるので max_details で抑える"
    crawl:
      sitemap_urls:
        - "https://vanguardproperties.com/sitemap.xml"
      sitemap_depth: 2
      # 物件ページは末尾にMLS番号が付く（.../inverness-ca-94937-325100256）。
      # ここを緩めると /properties/commercial のような一覧ページを拾い、
      # ページ内に出ている最高額を物件価格として登録してしまう。
      detail_url_include:
        - "/properties/[^/]*-\\d{6,}$"
      location_from: address
      max_details: 40

  # ------------------------------------------------------------------
  # 台湾の仲介サイト。2026-08-03、ユーザー判断により自動収集の対象にした。
  #
  # 経緯: 区分E(台湾)10件の実測で、robots.txt が許可し実際にページも取れる
  # のは7件だった。うち信義房屋は服務條款が「本網站禁止使用非人為方式瀏覽
  # 本站」（人間でない方法での閲覧を禁止）と明記しているため外した。
  # 残る6件は規約ページをサイト内から見つけられず、禁止の確認が取れない。
  # **確認できないことは許可されていることではない**が、その前提を承知の
  # うえで取得する判断があった。
  #
  # 掲載写真は加盟店・売主に帰属する。区分C(IDX)と同じ構図で、こちらでは
  # 権利者を機械的に分離できない。
  #
  # 守るものは変えない: robots.txt の尊重・3秒間隔・並列なし・
  # User-Agent に連絡先・bot検知の回避は実装しない。
  #
  # 6件のうち収集できたのは2件。残りはJS描画または詳細ページへ到達できない:
  #   Green-Acres PT … 地域一覧しか出ず、物件リンクはJS描画
  #   HouseFun       … トップのリンクが2本だけ。全面JS
  #   有巢氏房屋      … 一覧ページに物件リンクが出ない
  #   中信房屋        … 同上（HTML 19KB）
  #   永慶房屋        … 一覧に house/<id> が34件出るが、詳細ページは
  #                     /house/<id> も /buy/house/<id> も404
  # ------------------------------------------------------------------
  - key: hbhousing
    name: "住商不動產"
    rank: B
    # **2026-08-04 に crawl から降格。** 収集自体は動いたが、上がってきた
    # 物件が一般住宅ばかりで審査に耐えなかった（写真に社名ロゴ、様式不明の
    # マンション）。仲介サイトは在庫がそのまま流れる作りで、編集側の
    # キュレーションが一切かからない。良い物件を見つけたときに手でURLを
    # 投入する経路だけ残す。crawl: の設定は再開できるよう残置。
    mode: manual_only
    enabled: true
    base_url: "https://www.hbhousing.com.tw"
    note: "台湾。手動URL投入のみ。一覧ページ起点の設定は残置（?sn=... 形式）"
    crawl:
      index_urls:
        - "https://www.hbhousing.com.tw/buyhouse"
      # 物件は /detail?sn=ZS203675 の形。パスだけでは区別できないので
      # クエリまで含めて絞る。
      detail_url_include:
        - "/detail\\?sn=[A-Z0-9]+$"
      # 台湾の価格表記。3,980萬 / 1.2億 など。半角スペースが入る例もある。
      price_patterns:
        - "\\d[\\d,]*(?:\\.\\d+)?\\s*(?:萬元|萬|億)(?!\\s*/\\s*坪)"
      # 住所は漢字で、米国住所の書式を前提にした抽出が効かない。
      # 誤った所在地を入れるより、国だけ入れて市はスコアリングに委ねる。
      # 台湾の住所は「縣市＋區」が定型なので、米国住所と同じように錨に
      # できる。所在地を取れなかったものは他のソースと同じく落とす。
      location_from: tw_address
      country: "Taiwan"
      max_details: 40
  - key: century21tw
    name: "21世紀不動產（台湾）"
    rank: B
    # hbhousing と同じ理由で 2026-08-04 に crawl から降格。
    mode: manual_only
    enabled: true
    base_url: "https://www.century21.com.tw"
    note: "台湾。手動URL投入のみ。一覧起点の設定は残置（詳細は /buypage/<id>）"
    crawl:
      index_urls:
        - "https://www.century21.com.tw/buy/all-city/all-district/residence"
      detail_url_include:
        - "/buypage/\\d+$"
      # **「/坪」が続くものは坪単価なので除く。** このサイトは詳細ページで
      # 單價（51.38萬/坪）が總價（1,488萬）より先に出るため、除かないと
      # 坪単価を売出価格として登録してしまう。
      price_patterns:
        - "\\d[\\d,]*(?:\\.\\d+)?\\s*(?:萬元|萬|億)(?!\\s*/\\s*坪)"
      # 台湾の住所は「縣市＋區」が定型なので、米国住所と同じように錨に
      # できる。所在地を取れなかったものは他のソースと同じく落とす。
      location_from: tw_address
      country: "Taiwan"
      max_details: 40

  - key: zillow
    name: "Zillow"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.zillow.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"
  - key: redfin
    name: "Redfin"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.redfin.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"
  - key: compass
    name: "Compass"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.compass.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"
  # Trulia と StreetEasy は Zillow Group。Zillow と同じ扱いにする。
  # ここに書いていないと「未検討だから試してよい」と読まれる余地が残る。
  - key: trulia
    name: "Trulia"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.trulia.com"
    note: "Zillow Group。利用規約で自動収集禁止。手動URL投入のみ"
  - key: streeteasy
    name: "StreetEasy"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://streeteasy.com"
    note: "Zillow Group。利用規約で自動収集禁止。手動URL投入のみ"
  - key: realtor
    name: "Realtor.com"
    rank: B
    mode: manual_only
    enabled: true
    base_url: "https://www.realtor.com"
    note: "利用規約で自動収集禁止。手動URL投入のみ"

# ---------------------------------------------------------------------
# 販売シグナル検出（経路Bの核心）
#   スコア合計が min_signal_score 以上のものだけを候補化する。
# ---------------------------------------------------------------------
for_sale_signals:
  keyword_score: 1
  # 仲介サイトへのリンクは「売出中」の裏付けとして弱い。2点にしていたところ、
  # CIRCA のエージェント紹介ページ（本人の Compass のプロフィールへリンク）が
  # それだけで候補化された（2026-08-01）。1点に下げ、リンク単独では
  # min_signal_score に届かないようにしている。
  listing_link_score: 1
  price_score: 1
  min_signal_score: 2
  # 価格は「販売キーワードの近くにあるもの」だけを加点対象にする。
  # これがないと、建設費や事業費（例: €240 million の競技場）を売出価格として
  # 誤検出する。0 にすると文中のあらゆる金額を拾う（非推奨）。
  price_requires_keyword_within: 200
  keywords:
    - "for sale"
    - "on the market"
    - "listed for"
    # 2026-08-03: thespaces の Bordeaux の記事が「before listing at €1.19 million」
    # で、listed for に当たらず0点だった。同じ意味の言い回しなので足す。
    - "listing at"
    # 2026-08-03: Robb Report の「Landis Gores's Connecticut Home Hits the Market
    # for $3 Million」（Harvard Five の建築家による住宅）が1点で落ちていた。
    # on the market はあるが hits the market は別表現。
    - "hits the market"
    - "comes to market"
    # 2026-08-03: Robb Report の「This Former Barn in the Cotswolds Was
    # Reimagined as a Cozy Rural Retreat」（納屋を住居に転用した売出物件で、
    # 承認基準の中核そのもの）が0点だった。本文は
    # 「The property is now asking £1 million with Blue Book Agency」。
    # asking price はあったが、この形が無かった。
    - "is asking"
    - "now asking"
    - "asking price"
    - "now available"
    - "currently listed"
    - "販売中"
    - "売出中"
    # 「price upon request」はここから price_patterns に移した。これは販売の
    # 言い回しではなく価格の状態で、キーワードは何個あっても1点なので、
    # ここに置いても価格非公開の物件を拾えなかった。
  price_patterns:
    - '[$€£]\s?\d[\d,.]*\s?(million|M|k)?\b'
    - '\d[\d,.]*\s?(万円|億円)'
    # 価格非公開も「価格について述べている」ことに変わりなく、売出中の
    # 裏付けとしては金額と同等に扱う。
    # 2026-08-03: thespaces の Alicante の記事が「is on the market with
    # Adelante Homes, price on application」で、売出中と明記されているのに
    # 価格が無いという理由で1点止まりだった。
    - 'price\s+(on|upon)\s+(application|request)'
  listing_domains:
    - sothebysrealty.com
    - christiesrealestate.com
    - architectureforsale.com
    - zillow.com
    - redfin.com
    - compass.com
    - idealista.com
    - idealista.pt
    - rightmove.co.uk

# ---------------------------------------------------------------------
# 重点エリア / 優先ジャンル
# ---------------------------------------------------------------------
# focus_areas は area_match 軸（重み0.20）だけに効く。一致すれば100点、
# 外れても20点で、ここで候補が消えることはない。
#
# 2026-08-03: アメリカを全土に変更した。都市指定（LA/SF/Portland/Seattle/
# Chicago/New York）をやめて country のみにしている。
# 都市を並べていた頃も一致すれば同じ100点で、都市と国で差は付いていなかった。
# 「アメリカの物件はどこでも重点」という方針をそのまま設定に写した形。
#
# 元の都市と地区（戻すときのために残す。承認実例のあった地区）:
#   Los Angeles / San Francisco[South Beach, SOMA] / Portland[Pearl District]
#   Seattle[Pioneer Square] / Chicago[West Loop, Wicker Park, Logan Square]
#   New York[DUMBO, Brooklyn, Williamsburg, Tribeca]
focus_areas:
  - { country: "United States" }
  - { country: "Portugal" }
  - { country: "Spain" }
  - { country: "Taiwan" }

# ---------------------------------------------------------------------
# Instagram 自動投稿（[8]・準備中）
#   投稿先: @frmg.jpn（プロアカウント）
#   トークンは config ではなく DB の api_tokens に置く（instagram set-token）。
#   リフレッシュのたびに新しいトークンが発行されるため、静的な置き場では
#   更新を書き戻せない。app_secret は OAuth コールバック方式を使うときだけ
#   .env の INSTAGRAM_APP_SECRET に入れる。
# ---------------------------------------------------------------------
instagram:
  app_id: "2981348515540383"

# ---------------------------------------------------------------------
# 連載企画のラベル
#   どの企画に載せるかは編集判断であり、記事本文から機械的には決まらない。
#   スコアリングでは判定せず、審査UIで人が付ける。
#   key はDBに保存される値なので変更しない。label は表示名なので変更可。
# ---------------------------------------------------------------------
series:
  - { key: freming_pick,          label: "FREMING Pick" }
  - { key: hidden_gem,            label: "Hidden Gem" }
  - { key: penthouse_of_the_week, label: "Penthouse of the Week" }
  - { key: adaptive_reuse,        label: "Adaptive Reuse" }
  - { key: warehouse_loft,        label: "Warehouse Loft" }
  - { key: architects_house,      label: "Architect's House" }

# 承認済み8物件の分析（docs/approval-criteria.md）に基づくキーワード。
# 「前歴が目に見える形で残っている」ことが最も強い共通項だったため、
# ゴーストサイン・用途固有の部材・露出構造を示す語を厚くしている。
genres:
  priority: [adaptive_reuse, loft, architect, hidden_gem, penthouse]
  keywords:
    adaptive_reuse:
      ["conversion", "converted", "adaptive reuse", "former factory", "former school",
       "firehouse", "fire station", "warehouse conversion", "church conversion",
       "former warehouse", "clock tower", "ghost sign", "originally built as",
       "once a", "repurposed", "power station", "grain silo", "schoolhouse"]
    loft:
      ["loft", "warehouse", "industrial space", "open plan", "live/work",
       "exposed brick", "timber truss", "heavy timber", "cast iron column",
       "tin ceiling", "pressed metal ceiling", "freight elevator"]
    penthouse: ["penthouse", "rooftop residence", "top floor"]
    architect:
      ["designed by", "architect's own", "landmark home", "modernist",
       "midcentury", "mid-century", "case study house", "spanish colonial",
       "craftsman", "usonian", "post and beam", "butterfly roof"]
    hidden_gem: ["rarely seen", "little-known", "hidden", "off market", "never listed"]

# ---------------------------------------------------------------------
# スコアリング（Claude API）
# ---------------------------------------------------------------------
scoring:
  # 費用を抑えるため 2026-08-03 に claude-sonnet-5 から下げた。
  # 上位に切替可: claude-sonnet-5 / claude-opus-5（そのときは effort も戻す）
  model: "claude-haiku-4-5"
  # max_tokens は thinking と本文の合計に効く上限。judgement の JSON 自体は
  # 小さいが、thinking が動くモデルでは上限に届きうるので余裕を持たせている
  # （打ち切られた場合は ScoringError で理由が出る）。
  max_tokens: 8000
  # effort は Opus 4.5 以降と Sonnet 4.6 以降にしか無い。claude-haiku-4-5 に
  # 渡すと 400 になるので、送らない（null）。上位モデルに戻すときは
  # medium から。指定できる値: low | medium | high | xhigh | max
  effort: null
  summary_max_chars: 80
  score_scale: 100             # 0-100
  weights:                     # 合計 1.0
    story: 0.25                       # 用途転換・歴史・建築家の物語
    source_rank: 0.15                 # S > A > B
    editorial_for_sale_bonus: 0.20    # 編集ソース掲載 かつ 販売中 = Hidden Gem
    genre_match: 0.15
    area_match: 0.20                  # 重点エリアを優先（2026-08-01 に 0.10 から引き上げ）
    price: 0.05                       # 二の次。高額を優遇しない
  source_rank_score:
    S: 1.0
    A: 0.7
    B: 0.4
  # スコアリングのプロンプトに含める承認済みの実例（docs/approval-criteria.md）。
  # 「なぜ承認されたか」を few-shot としてLLMに示し、判断基準を揃える。
  approved_examples:
    - "1868年の倉庫 Oriental Warehouse（SF South Beach）。壁面のゴーストサインとアーチ、木トラスが住居に残る"
    - "電気設備会社 EOFF Electric Company の社屋（Portland Pearl District）。壁面広告がそのまま残る"
    - "消防署のコンバージョン（Chicago）。赤いアーチ型の消防車扉が現役のまま玄関、ブリキ型押し天井"
    - "Eagle Warehouse の時計塔（Brooklyn DUMBO）。巨大な時計文字盤がそのまま窓になっている"
    - "花崗岩の山塊の直下に建つ砂漠のモダニズム住宅（東シエラ）。立地そのものが主題"
    - "板張り天井と石積み暖炉のミッドセンチュリー住宅（LA丘陵）。時代の家具ごと残る"
    - "素焼き瓦と白漆喰のスパニッシュコロニアル（LA）。庭と建物が一体"
    - "深い軒と木の重なりを持つ和／クラフツマン住宅（LA近郊）。庭に鉄の産業遺物"
  # 上の実例から抽出した、判断の軸（プロンプトに明示する）
  approval_notes:
    - "最重要は『前歴が目に見える形で残っている』こと。単に用途転換されただけでは足りず、転換前の正体が写真から読み取れること（ゴーストサイン、用途固有の部材、露出構造）"
    - "時代・様式が特定できること。様式不明の現代建売・新築マンションは対象外"
    - "一点物であること。同一仕様が複数存在する物件は対象外"
    - "立地が物語の一部になっていること"
    - "重点エリアは加点要素であり足切り条件ではない。物語性が十分に強ければエリア外でも承認しうる（Chicago / Brooklyn は承認実績を受けて重点エリアに追加した経緯がある）"
  thresholds:
    min_to_persist: 30         # これ未満は保存はするが一覧デフォルト非表示
    highlight_above: 80
    # **物語性の足切り。** これ未満は他の軸が満点でも0点にする。
    # 加重平均だけで見ていたころ、台湾の仲介物件は story=0 でも
    # 「販売中(20) + 重点エリア(20) + ランクB(6) + 価格あり(5) + ジャンル不明(3)」
    # の54点で min_to_persist を超え、中身に関係なく審査に上がっていた。
    story_min: 40
  feedback:
    recent_reasons_in_prompt: 30   # 直近N件の非承認理由をプロンプトに含める
    tagging_batch_size: 10         # N件溜まるごとに reason_tag を付与
    rule_candidate_min_hits: 3     # 同一タグがN回でルール候補として提示
    # 非承認理由の分類先。表記のゆれを吸収して集計できるようにするための
    # 固定語彙。どれにも当てはまらない理由は other に寄せ、頻出するようなら
    # ここに新しいタグを足す。
    tags:
      - no_visible_provenance   # 前歴の痕跡が残っていない
      - style_unclear           # 様式・築年が特定できない
      - not_one_of_a_kind       # 一点物ではない（分譲・同一仕様）
      - not_for_sale            # 売出中ではない
      - image_quality           # 画像が足りない / 品質が低い
      - duplicate               # 既出・類似を納品済み
      - area_mismatch           # エリアが合わない
      - other

# ---------------------------------------------------------------------
# 審査UI
# ---------------------------------------------------------------------
review_ui:
  host: "127.0.0.1"
  port: 8000
  page_size: 50
  default_filter: pending
  # サムネイルの一辺（px）。正方形で表示する。
  thumbnail_px: 170

# ---------------------------------------------------------------------
# 承認から納品までの自動化
#
# auto: true なら serve（審査UI）の中でワーカーが動き、承認したものを
# 順に納品する。別ターミナルで deliver を叩く必要はない。
# 納品は1件ずつ直列。画像取得は相手サイトへのアクセスなので、
# 収集と同じ間隔・直列のルールを守る。
# ---------------------------------------------------------------------
delivery:
  auto: true
  poll_interval_sec: 30
  batch_limit: 5
  max_attempts: 3
  retry_after_sec: 600

# ---------------------------------------------------------------------
# 画像取得・加工
# ---------------------------------------------------------------------
images:
  max_per_property: 10
  min_short_edge_px: 800           # ロゴ・アイコン混入対策
  # **単色の「写真なし」画像を持つ物件は収集時に落とす。**
  # Dream Town は写真が未登録の物件にも og:image を返し、中身は
  # 1280x800 の #D0D0D0 一色。寸法が本物と同じなので min_short_edge_px
  # では落ちず、審査UIに灰色の四角が出ていた。
  # 実測: 単色 0.00 / 薄いグラデーション 2.29 / 実画像 22.27
  require_real_photo: true
  flat_stddev_max: 3.0
  allowed_content_types: ["image/jpeg", "image/png", "image/webp"]
  work_dir: "data/images"

process:
  output_size: [1080, 1080]
  jpeg_quality: 90
  pad_when_aspect_over: 2.0        # 縦横比2.0超はクロップせず余白パディング
  pad_color: "#FFFFFF"
  resample: lanczos

# ---------------------------------------------------------------------
# Drive納品
#   parent_folder_id: 納品先の親フォルダ
#   shared_drive_id : 共有ドライブ配下ならそのドライブID（マイドライブなら null）
#     ※ サービスアカウントは「マイドライブ」に保存容量を持たないため、
#       共有ドライブを強く推奨。詳細は scripts/check_drive.py の診断を参照。
# ---------------------------------------------------------------------
drive:
  enabled: true
  # 認証方式:
  #   oauth           … OAuthクライアント（デスクトップアプリ）で人のアカウントとして認証。
  #                     組織ポリシーでサービスアカウント鍵を作れない場合はこれ。
  #   service_account … サービスアカウントのJSON鍵（credentials_path）
  #   adc             … gcloud のログイン / Workload Identity 連携 / 権限借用
  auth_mode: oauth
  oauth_client_secret_path: "credentials/oauth_client.json"
  oauth_token_path: "credentials/token.json"     # 初回認証後に自動生成される
  credentials_path: "credentials/service-account.json"   # auth_mode: service_account 用
  parent_folder_id: "1HrlJ9QFGlTEVl8M-HY8nxGTu3DvkCNV3"   # ig-post（共有ドライブ配下）
  shared_drive_id: "0AMkLSuinS6H_Uk9PVA"
  folder_prefix: "frmg_ig"
  sequence_digits: 3
  meta_filename: "meta.txt"
  verify_uploaded_size: true       # アップロード後 files.get でサイズ再取得し 0 バイトでないか確認
  preflight:
    enabled: true                  # 起動時に実際にテストファイルを作成→削除して権限検証
    test_filename: ".frmg_write_test"
  retry:
    max_attempts: 5
    backoff_factor: 2.0
