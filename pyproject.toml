[project]
name = "freming-curated"
version = "0.1.0"
description = "FREMING CURATED - 物件収集・審査・画像加工パイプライン"
requires-python = ">=3.11"
dependencies = [
    # 設定・共通
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # HTTP / 収集
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # スコアリング
    "anthropic>=0.40",
    # 画像
    "pillow>=10.0",
    # Drive
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    # 審査UI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# PostgreSQL（Neon / Supabase など）に繋ぐときだけ必要。SQLite で動かす分には要らない。
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
freming = "freming.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freming = ["db/migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
