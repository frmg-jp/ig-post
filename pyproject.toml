[project]
name = "freming-curated"
version = "0.1.0"
description = "FREMING CURATED - 物件収集・審査・画像加工パイプライン"
requires-python = ">=3.11"
dependencies = [
    # 設定・共通
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # HTTP / 収集
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # スコアリング
    "anthropic>=0.40",
    # 画像
    "pillow>=10.0",
    # Drive
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    # 審査UI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# ruff はバージョンを固定する。上限を切らずにいたところ、新しい ruff が
# 既定で見るルールを増やし、こちらが何も変えていないのに CI が30回連続で
# 失敗した（2026-08-03）。上げるときは、手元で ruff check を通してから。
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]
# PostgreSQL（Neon / Supabase など）に繋ぐときだけ必要。SQLite で動かす分には要らない。
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
freming = "freming.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freming = ["db/migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# 適用するルールを明示する。
#
# 書いていないと ruff の既定に従うが、**既定は ruff のバージョンで変わる。**
# 2026-08-03 時点で CI（テスト workflow）は30回連続で失敗しており、原因は
# コードではなく、新しい ruff が既定で見るルールが増えたことだった。
# dev の ruff もバージョンを固定してある。両方を止めないと、こちらが何も
# していないのに、ある日を境に CI が赤くなる。
#
# ルールを増やすときは、まとめて直してから1つずつ足すこと。
[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import の並び
    "UP",       # 古い書き方を新しくする
    "B",        # bugbear（引っかかりやすい書き方）
    "BLE",      # 素の except Exception。握り潰しは noqa で理由を書く運用
    "RUF",
]
ignore = [
    # 全角の丸括弧・コロン・空白を「紛らわしい文字」として全部指摘してくる。
    # このコードベースはコメントも docstring も日本語なので、有効にすると
    # 800件を超える。文章を半角に直す話ではないので落とす。
    "RUF001", "RUF002", "RUF003",
    # 行の長さ。**全角文字を2桁として数える**ため、日本語のコメントでは
    # 100字に届く前に引っかかる。実際に指摘された21行のうち12行は
    # 100文字未満で、63文字の行まで入っていた。この書き方に合わないので
    # 外す。line-length = 100 はフォーマッタ側の目安として残す。
    "E501",
]
# 意図的に入れていないもの:
#   SIM  … with を1行に潰させると、ロックとテストの意図が読めなくなる
#   ISC  … 長いSQLやJSONを行またぎの文字列で書いている箇所が多い
#   PYI  … 型スタブ向けで、このコードベースには噛み合わない
#   S    … bandit。表名を差し込む COUNT(*) や 0.0.0.0 での待ち受けを指摘して
#          くるが、どちらも意図してそう書いている。入れるなら個別に潰してから
#   DTZ  … tz なしの datetime。DBに入れる時刻は _now() に集約済み
