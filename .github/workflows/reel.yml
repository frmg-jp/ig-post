name: 週次リール

# リールだけを GitHub Actions で作って投稿する。
#
# **審査UI（Render の無料プラン）では作れない。** リールは 1080x1920 を
# 2倍サイズに広げてから落とすので数百MBのメモリが要り、ffmpeg も入って
# いない。ここなら ffmpeg を入れられて、メモリも十分ある。
#
# **公開URLが要らないのがこの分割の肝。** リールの動画は
# rupload.facebook.com へ直接送るので、Meta がこちらへ取りに来ない。
# 画像を配れない場所でも投稿できる。
#
# 収集（collect.yml）とは分ける。収集は毎朝で、リールは週1。
# 同じジョブに入れると、収集が落ちたときにリールも巻き添えになる。

on:
  # ------------------------------------------------------------------
  # 毎週月曜 19:00 JST（UTC 10:00）。2026-08-10 に止めていたのを
  # 2026-08-31 に再開した。config.yaml の instagram.reel_weekday /
  # reel_time と合わせること。
  # ここだけ直しても予定は作られない（予定は collect.yml の post plan）。
  #
  # **定刻には出ない。** GitHub の定期実行は混雑時に大きく遅れる仕様で、
  # このリポジトリの実測でも毎回3〜10時間ずれている。19:00 の枠を過ぎた
  # 予定を「動いたときに出す」経路だと思っておくこと。時刻を守りたく
  # なったら、審査UI側で作れるようにする（ffmpeg とメモリが要る）か、
  # 外部のスケジューラから叩く必要がある。
  schedule:
    - cron: "0 10 * * 1"
  # ------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      mode:
        description: "何をするか"
        type: choice
        required: true
        default: preview
        options:
          - preview   # 出さずに1本組んで、動画をダウンロードできるようにする
          - publish   # **本番の @frmg.jpn に出る**
      dry_run:
        description: "publish のとき、投稿せず中身だけ見る"
        type: boolean
        default: true

concurrency:
  group: freming-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -e ".[postgres]"

      # runner に入っていることが多いが、入っていない版を引くと
      # リールが黙って作れなくなる。明示的に用意する。
      - name: ffmpeg を用意
        run: |
          ffmpeg -version >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          }
          ffmpeg -version | head -1

      - name: マイグレーション適用
        run: python -m freming.cli db migrate

      # 出す前に中身を見るための経路。**出す処理と同じコードで組む**ので、
      # ここで見た動画がそのまま出るものになる（build_weekly_reel）。
      # --fallback を付けてあるのは、いまのトークンにインサイトの権限が
      # 無いため（2026-08-31 実測）。**試写だけの措置**で、本番の
      # reel_fallback_recent は false のまま。どちらで選んだかは出力に出る。
      - name: リールを試写用に組む
        if: ${{ github.event.inputs.mode == 'preview' }}
        run: python -m freming.cli reel preview --out out/reel-preview.mp4 --fallback

      - name: 試写用の動画を置いていく
        if: ${{ github.event.inputs.mode == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          # コマも一緒に置く。**仕上がりが変なときは動画より先にここを見る**と
          # 原因が早く分かる（どの写真が悪いのかが1枚ずつ見える）。
          path: |
            out/reel-preview.mp4
            out/.reel-preview-frames/
          retention-days: 7
          if-no-files-found: error
          # コマの置き場が「.」で始まるので、既定では**動画しか入らない**。
          # 実際に 2026-08-31 の1本目がそれで、動画1ファイルだけになった。
          include-hidden-files: true

      # **リールだけを扱う。** 通常投稿とストーリーズは審査UI側の担当で、
      # ここで拾うと二重に出る（状態遷移で防いではいるが、担当を分けるのが前提）。
      #
      # 条件が `!= preview` なのは、**定期実行では inputs が空になる**ため。
      # `== publish` と書くと、毎週月曜に起動して何もせず終わる。
      #
      # `--limit 1` は**溜まった予定がまとめて出るのを防ぐ**ため。定期実行を
      # 止めていた間の枠（08/31 など）が残っており、上限を付けないと次に
      # 動いたとき2本続けて公開される。
      - name: リールを投稿
        if: ${{ github.event.inputs.mode != 'preview' }}
        run: |
          python -m freming.cli post run --kind reel --limit 1 \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
