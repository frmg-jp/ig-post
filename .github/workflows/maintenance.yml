name: 手動メンテナンス

# 手元のターミナルが要る作業を、GitHub の画面から押せるようにする。
# **チームの誰でも実行できる**ようにするための経路で、ここに置いたものは
# 特定の PC を必要としない。
#
# 費用のかかるもの（採点のやり直し・本文の後追い）は、既定を dry-run に
# してある。押しただけでは金額が出るだけで、何も起きない。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "何をするか"
        type: choice
        required: true
        options:
          - migrate            # DBの更新だけ
          - backfill-captions  # 投稿本文の項目を既存分に埋める（API費用）
          - backfill-listings  # 記事の中の販売ページURLを既存分に入れる（費用なし）
          - rescore            # 採点をやり直す（API費用・納品済みは除く）
          - source-report      # ソース別の歩留まり（費用なし）
          - post-show          # 投稿予定の一覧（費用なし）
          - exchange-ig-code   # 受け取った code をトークンに換える（費用なし）
          - check-ig-token     # トークンの疎通とスコープ（費用なし）
          - post-replan        # 未投稿の予定の本文を作り直す（費用なし）
          - post-reschedule    # 期限切れ・旧枠の予定を先の枠へ動かす（費用なし）
          - post-plan          # 空いている枠を埋める（費用なし）
          - post-compact       # 空いた枠のぶん、後ろの予定を前に詰める（費用なし）
          - post-run           # 時間が来た通常投稿を1本出す（**本番のIGに出る**）
          - image-report       # 1件の画像の内訳（枚数が足りない理由。費用なし）
      apply:
        description: "本当に実行する（外すと見積もりだけ）"
        type: boolean
        default: false
      limit:
        description: "対象の上限（backfill / rescore 用）"
        default: ""

concurrency:
  group: freming-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 再認可のときだけ使う。どちらも Secrets 経由で、ログには出ない
      # （GitHub が値を伏せる）。**code は使い切りなので、済んだら
      # IG_AUTH_CODE を消すこと。** 残しても次は失効して使えない。
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_AUTH_CODE: ${{ secrets.IG_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -e ".[postgres]"

      - name: マイグレーション適用
        run: python -m freming.cli db migrate

      - name: 実行
        if: ${{ github.event.inputs.action != 'migrate' }}
        run: |
          set -eu
          LIMIT=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT="--limit ${{ github.event.inputs.limit }}"
          fi
          YES=""
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            YES="--yes"
          fi
          case "${{ github.event.inputs.action }}" in
            backfill-captions)
              python -m freming.cli backfill-captions $LIMIT $YES
              # 埋めたあとは、まだ出していない予定の本文を作り直す。
              # 予定を作った時点の本文が入っているので、そのままだと
              # 足した項目が反映されない。
              if [ -n "$YES" ]; then
                python -m freming.cli post replan
              fi
              ;;
            backfill-listings)
              python -m freming.cli backfill-listings $LIMIT $YES
              ;;
            rescore)          python -m freming.cli rescore $LIMIT $YES ;;
            source-report)    python -m freming.cli source-report ;;
            post-show)        python -m freming.cli post show ;;
            exchange-ig-code)
              if [ -z "${INSTAGRAM_AUTH_CODE:-}" ] || [ -z "${INSTAGRAM_APP_SECRET:-}" ]; then
                echo "Secrets の IG_AUTH_CODE と INSTAGRAM_APP_SECRET を先に登録してください。" >&2
                exit 2
              fi
              python -m freming.cli instagram exchange-code
              python -m freming.cli instagram check
              ;;
            check-ig-token)   python -m freming.cli instagram check ;;
            post-replan)      python -m freming.cli post replan ;;
            post-reschedule)  python -m freming.cli post reschedule ;;
            post-plan)
              python -m freming.cli post plan
              python -m freming.cli post show
              ;;
            post-compact)
              python -m freming.cli post compact
              python -m freming.cli post show
              ;;
            image-report)
              # limit に post_id を入れて実行する（枚数の「!」が付いた行の番号）。
              if [ -z "${{ github.event.inputs.limit }}" ]; then
                echo "「対象の上限」欄に post_id を入れてください。" >&2
                exit 2
              fi
              python -m freming.cli image-report --post-id ${{ github.event.inputs.limit }}
              ;;
            post-run)
              # **本番の @frmg.jpn に出る。** 「本当に実行する」を外すと
              # 中身を出すだけで投稿しない。
              #
              # 通常は審査UI（Render）の常駐ワーカーが 09:00 に出す。
              # ここはその取りこぼしを人が出し直すための経路で、
              # 1回につき1本だけにしてある（まとめて出ない）。
              if [ -n "$YES" ]; then
                python -m freming.cli post run --kind feed --limit 1
              else
                python -m freming.cli post run --kind feed --limit 1 --dry-run
              fi
              python -m freming.cli post show
              ;;
          esac
