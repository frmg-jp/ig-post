name: 収集と採点

# 定期実行。収集 → 採点までを回し、審査は人が審査UIで行う。
#
# 守っていること:
#   - concurrency で重複起動を止める。前の実行が終わる前に次が走ると、
#     同一ドメインへの並列アクセスになって収集ポリシーが破れる。
#   - 納品は行わない。Drive の鍵をこの経路に置かずに済ませるため。
on:
  schedule:
    # 毎日 09:00 JST（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        # 13ソース × 10件 = 1日130件が上限。採点は score --limit 40 なので
        # 全部が上限まで入ると溜まるが、実際に候補になるのはその一部。
        # 増やすときは採点の上限も一緒に見ること（費用に直結する）。
        description: "1ソースあたりの上限件数"
        default: "10"

concurrency:
  group: freming-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -e ".[postgres]"

      - name: マイグレーション適用
        run: python -m freming.cli db migrate

      # Instagram の長期トークンは60日で失効し、24時間経過後から更新できる。
      # 毎日更新して常に残り60日を保つ。未設定の環境では何もせず終わる。
      # 失敗しても収集と採点は無関係なので、ワークフロー全体は止めない。
      - name: IGトークン更新
        continue-on-error: true
        run: python -m freming.cli instagram refresh

      # 審査UIの価格の並べ替えに使う円換算レート。毎日呼ぶが、実際に
      # 外へ出るのは前回から7日経ったときだけ（fx.py の DEFAULT_MAX_AGE）。
      # 専用の週次ワークフローにしないのは、1回落ちても翌日やり直せるため。
      # 失敗しても収集・採点とは無関係なので全体は止めない。
      - name: 為替レート更新
        continue-on-error: true
        run: python -m freming.cli fx update

      - name: 収集
        # 1ソースでも落ちたら残りを止める、ということはしない。
        # 相手サイト側の一時的な不調で全体が止まると、翌日まで何も入らない。
        continue-on-error: true
        run: |
          for source in $(python -m freming.cli sources --enabled); do
            echo "::group::collect $source"
            python -m freming.cli collect --source "$source" \
              --limit "${{ github.event.inputs.limit || 10 }}" || true
            echo "::endgroup::"
          done

      - name: 採点
        run: python -m freming.cli score --limit 40

      # 非承認理由をタグに分類し、繰り返された指摘をルール候補にする。
      # **ここで作るのは候補まで。** プロンプトに載るのは審査UIで人が
      # 承認したものだけなので、判定基準が勝手に変わることはない。
      # 未分類の理由が無い日は API を呼ばずに終わる。
      - name: 学習
        run: python -m freming.cli learn

      # ------------------------------------------------------------------
      # **2026-08-10 から止めている。** 再開の指示が出るまで。
      #
      # 予定を作るだけで投稿はしないが、止めている間も毎朝積み上がると、
      # 再開時に過去日の予定をまとめて先送りすることになる。
      #
      # 戻すときは下の3行のコメントを外す。投稿の予定を3日先まで並べる。
      # 投稿するのは審査UI側（Meta が画像を取りに来る先が審査UIだから）。
      # 在庫が足りない日は枠を空ける（埋めるために基準を下げない）。
      #
      # - name: 投稿予定の作成
      #   continue-on-error: true
      #   run: python -m freming.cli post plan
      # ------------------------------------------------------------------

      - name: 件数
        run: python -m freming.cli status
