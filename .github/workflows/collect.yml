name: 収集と採点

# 定期実行。収集 → 採点までを回し、審査は人が審査UIで行う。
#
# 守っていること:
#   - concurrency で重複起動を止める。前の実行が終わる前に次が走ると、
#     同一ドメインへの並列アクセスになって収集ポリシーが破れる。
#   - 納品は行わない。Drive の鍵をこの経路に置かずに済ませるため。
on:
  schedule:
    # 毎日 09:00 JST（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        # 13ソース × 10件 = 1日130件が上限。採点は score --limit 40 なので
        # 全部が上限まで入ると溜まるが、実際に候補になるのはその一部。
        # 増やすときは採点の上限も一緒に見ること（費用に直結する）。
        description: "1ソースあたりの上限件数"
        default: "10"

concurrency:
  group: freming-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -e ".[postgres]"

      - name: マイグレーション適用
        run: python -m freming.cli db migrate

      - name: 収集
        # 1ソースでも落ちたら残りを止める、ということはしない。
        # 相手サイト側の一時的な不調で全体が止まると、翌日まで何も入らない。
        continue-on-error: true
        run: |
          for source in $(python -m freming.cli sources --enabled); do
            echo "::group::collect $source"
            python -m freming.cli collect --source "$source" \
              --limit "${{ github.event.inputs.limit || 10 }}" || true
            echo "::endgroup::"
          done

      - name: 採点
        run: python -m freming.cli score --limit 40

      - name: 件数
        run: python -m freming.cli status
