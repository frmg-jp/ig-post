name: 収集と採点

# 定期実行。収集 → 採点までを回し、審査は人が審査UIで行う。
#
# 守っていること:
#   - concurrency で重複起動を止める。前の実行が終わる前に次が走ると、
#     同一ドメインへの並列アクセスになって収集ポリシーが破れる。
#   - 納品は行わない。Drive の鍵をこの経路に置かずに済ませるため。
on:
  schedule:
    # 毎日 09:00 JST（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        # 13ソース × 10件 = 1日130件が上限。採点は score --limit 40 なので
        # 全部が上限まで入ると溜まるが、実際に候補になるのはその一部。
        # 増やすときは採点の上限も一緒に見ること（費用に直結する）。
        description: "1ソースあたりの上限件数"
        default: "10"

permissions:
  # Workload Identity 連携（画像検索）に要る。これが無いと OIDC トークンが
  # 注入されず、auth が「ACTIONS_ID_TOKEN_REQUEST_TOKEN が無い」で落ちる。
  # 2026-09-15 に実際に踏んだ。
  id-token: write
  contents: read

concurrency:
  group: freming-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -e ".[postgres]"

      # 画像検索（Cloud Vision）のためだけの認証。
      # 鍵のJSONは作られず、その場限りの資格情報だけが置かれる。
      # 使うスコープ（cloud-platform）は images/discover.py 側で指定する。
      # 未設定のリポジトリでも収集は動いてほしいので、失敗しても止めない。
      - name: Google に認証（Workload Identity 連携）
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # **scopes という入力はこの action には無い**（v2 の警告で判明。
          # 2026-09-15）。資格情報ファイルを置くだけで、スコープは使う側が
          # google.auth.default(scopes=[...]) で指定する（drive.py /
          # images/discover.py）。ここに書いても黙って捨てられる。

      - name: マイグレーション適用
        run: python -m freming.cli db migrate

      # Instagram の長期トークンは60日で失効し、24時間経過後から更新できる。
      # 毎日更新して常に残り60日を保つ。未設定の環境では何もせず終わる。
      # 失敗しても収集と採点は無関係なので、ワークフロー全体は止めない。
      - name: IGトークン更新
        continue-on-error: true
        run: python -m freming.cli instagram refresh

      # 審査UIの価格の並べ替えに使う円換算レート。毎日呼ぶが、実際に
      # 外へ出るのは前回から7日経ったときだけ（fx.py の DEFAULT_MAX_AGE）。
      # 専用の週次ワークフローにしないのは、1回落ちても翌日やり直せるため。
      # 失敗しても収集・採点とは無関係なので全体は止めない。
      - name: 為替レート更新
        continue-on-error: true
        run: python -m freming.cli fx update

      - name: 収集
        # 1ソースでも落ちたら残りを止める、ということはしない。
        # 相手サイト側の一時的な不調で全体が止まると、翌日まで何も入らない。
        continue-on-error: true
        run: |
          for source in $(python -m freming.cli sources --enabled); do
            echo "::group::collect $source"
            python -m freming.cli collect --source "$source" \
              --limit "${{ github.event.inputs.limit || 10 }}" || true
            echo "::endgroup::"
          done

      - name: 採点
        run: python -m freming.cli score --limit 40

      # **出したはずの投稿がアカウントに残っているかを毎日見る。**
      # 2026-09 に3件（09/05・09/07・09/12）が、media_id と permalink まで
      # 発行されたあとアカウントから消えていた。こちらの投稿処理は成功して
      # いるので、記録だけ見ていても気づけない。気づいたのは週次リールの
      # 件数が合わなかったときで、最初の1件から1週間たっていた。
      #
      # continue-on-error にしてあるのは、消失が見つかると exit 1 になる
      # ため。**収集を止める理由にはしない**が、ログには赤で残る。
      - name: 公開済みの投稿が残っているか確認
        continue-on-error: true
        run: python -m freming.cli post audit --limit 60

      # **出した投稿のリーチを記録する。** 読むだけで費用はかからない。
      # リーチは時間とともに伸びるので、直近30日は毎日読み直す。
      # 2026-09-15 まで、週次リールの選抜で毎週読んでいたのに1件も
      # 保存しておらず、「先週と比べてどうだったか」が言えなかった。
      - name: リーチを記録
        continue-on-error: true
        run: python -m freming.cli post reach --days 30

      # 非承認理由をタグに分類し、繰り返された指摘をルール候補にする。
      # **ここで作るのは候補まで。** プロンプトに載るのは審査UIで人が
      # 承認したものだけなので、判定基準が勝手に変わることはない。
      # 未分類の理由が無い日は API を呼ばずに終わる。
      - name: 学習
        run: python -m freming.cli learn

      # **枚数が足りない物件を、他のサイトから足す。**
      # 掲載ページに3枚しか無い記事は読み直しても増えない（refetch-images）。
      # 手元の写真を画像検索にかけて、同じ写真が載っている別の記事から足す。
      #
      # **--limit 5 は費用の上限でもある。** 1件につき2回呼ぶので
      # 1日10回・月300回。Cloud Vision の Web Detection は月1000回まで
      # 無料なので、この範囲なら費用は出ない。増やすときは請求を見ること。
      #
      # 認証に失敗していれば1件目で止まる（費用は出ない）。収集を止める
      # 理由にはしないので continue-on-error。
      - name: 足りない画像を他サイトから足す
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        continue-on-error: true
        run: python -m freming.cli fill-images --all --limit 5

      # 投稿の予定を3日先まで並べる。**投稿はしない。** 投稿するのは
      # 審査UI側（Meta が画像を取りに来る先が審査UIだから）。ここで
      # 予定だけ作っておくと、人が朝いちで「投稿予定」を見て止められる。
      # 在庫が足りない日は枠を空ける（埋めるために基準を下げない）。
      # （2026-08-10〜08-22 は停止していた。本稼働に合わせて再開）
      - name: 投稿予定の作成
        continue-on-error: true
        run: python -m freming.cli post plan

      - name: 件数
        run: python -m freming.cli status
